<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Host — Game That Tune</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eaeaea;
      min-height: 100vh;
      padding: 20px;
    }
    .header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 20px;
    }
    h1 { font-size: 1.4rem; }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .phase-lobby   { background: #444; }
    .phase-question { background: #2471a3; }
    .phase-reveal  { background: #1e8449; }
    .phase-gameover { background: #7d3c98; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      max-width: 960px;
    }
    .full { grid-column: 1 / -1; }

    .card {
      background: #0f3460;
      border-radius: 12px;
      padding: 16px;
    }
    .card-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #888;
      margin-bottom: 12px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 8px;
      transition: opacity 0.15s;
    }
    .btn:last-child { margin-bottom: 0; }
    .btn:hover:not(:disabled) { opacity: 0.88; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-green  { background: #1e8449; color: white; }
    .btn-blue   { background: #2471a3; color: white; }
    .btn-orange { background: #ca6f1e; color: white; }

    .progress-num {
      font-size: 2.5rem;
      font-weight: 700;
      text-align: center;
      padding: 16px 0 4px;
    }
    .progress-sub { color: #888; font-size: 0.8rem; text-align: center; }

    .q-text {
      background: #1a1a2e;
      border-radius: 8px;
      padding: 12px;
      font-size: 1rem;
      line-height: 1.45;
      margin-bottom: 12px;
      min-height: 48px;
      color: #ccc;
    }

    .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .opt {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
    }
    .opt .lbl { font-weight: 800; font-size: 1rem; flex-shrink: 0; }
    .opt.A { background: #2471a3; }
    .opt.B { background: #922b21; }
    .opt.C { background: #935116; }
    .opt.D { background: #1e8449; }
    .opt.correct { outline: 2px solid #2ecc71; }

    .media-hint { color: #888; font-size: 0.8rem; word-break: break-all; }

    .player-list { list-style: none; }
    .player-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: #1a1a2e;
      border-radius: 6px;
      margin-bottom: 5px;
      font-size: 0.9rem;
    }
    .player-pts { font-weight: 700; color: #f39c12; }

    @media (max-width: 580px) {
      .grid { grid-template-columns: 1fr; }
      .full { grid-column: 1; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎵 Host Panel</h1>
    <span class="badge phase-lobby" id="phase-badge">Lobby</span>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-label">Controls</div>
      <button class="btn btn-green" id="start-btn">Reset &amp; Start Game</button>
      <button class="btn btn-blue"   id="next-btn"   disabled>Show First Question</button>
      <button class="btn btn-orange" id="reveal-btn" disabled>Reveal Answer</button>
    </div>

    <div class="card">
      <div class="card-label">Answers Submitted</div>
      <div class="progress-num" id="progress-num">—</div>
      <div class="progress-sub" id="progress-sub">waiting for question</div>
    </div>

    <div class="card full">
      <div class="card-label">Current Question <span id="q-counter" style="font-weight:400;text-transform:none;letter-spacing:0;"></span></div>
      <div class="q-text" id="q-text">No question yet</div>
      <div class="opts" id="opts"></div>
      <div class="media-hint" id="media-hint"></div>
    </div>

    <div class="card full">
      <div class="card-label">Players (<span id="player-count">0</span>)</div>
      <ul class="player-list" id="player-list"></ul>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const LABELS = ['A', 'B', 'C', 'D'];

    const startBtn  = document.getElementById('start-btn');
    const nextBtn   = document.getElementById('next-btn');
    const revealBtn = document.getElementById('reveal-btn');

    socket.emit('register', { role: 'host' });

    function setPhase(p) {
      const badge = document.getElementById('phase-badge');
      badge.textContent = p.charAt(0).toUpperCase() + p.slice(1);
      badge.className = `badge phase-${p}`;
      nextBtn.disabled   = p !== 'lobby' && p !== 'reveal';
      revealBtn.disabled = p !== 'question';
      nextBtn.textContent = p === 'lobby' ? 'Show First Question' : 'Next Question';
    }

    startBtn.addEventListener('click',  () => socket.emit('start-game'));
    nextBtn.addEventListener('click',   () => socket.emit('show-question'));
    revealBtn.addEventListener('click', () => socket.emit('reveal-answer'));

    socket.on('game-started', () => {
      setPhase('lobby');
      document.getElementById('progress-num').textContent = '—';
      document.getElementById('progress-sub').textContent = 'waiting for question';
      document.getElementById('q-text').textContent = 'No question yet';
      document.getElementById('q-counter').textContent = '';
      document.getElementById('opts').innerHTML = '';
      document.getElementById('media-hint').textContent = '';
    });

    socket.on('players-update', (players) => {
      document.getElementById('player-count').textContent = players.length;
      document.getElementById('player-list').innerHTML = players.map((p, i) => `
        <li class="player-item">
          <span>${i + 1}. ${p.name}</span>
          <span class="player-pts">${p.score} pts</span>
        </li>
      `).join('');
    });

    socket.on('question', (data) => {
      setPhase('question');
      document.getElementById('q-counter').textContent = `(${data.index + 1} / ${data.total})`;
      document.getElementById('q-text').textContent = data.question;
      document.getElementById('opts').innerHTML = data.options.map((opt, i) => `
        <div class="opt ${LABELS[i]}${i === data.correctIndex ? ' correct' : ''}">
          <span class="lbl">${LABELS[i]}</span>${opt}
        </div>
      `).join('');
      const hints = [data.audioUrl && `🔊 ${data.audioUrl}`, data.videoUrl && `🎬 ${data.videoUrl}`].filter(Boolean);
      document.getElementById('media-hint').textContent = hints.join('  ');
    });

    socket.on('answer-count', ({ answered, total }) => {
      document.getElementById('progress-num').textContent = `${answered} / ${total}`;
      document.getElementById('progress-sub').textContent = answered === total && total > 0 ? 'All answered!' : 'answered';
    });

    socket.on('reveal', () => setPhase('reveal'));
    socket.on('game-over', () => setPhase('gameover'));
  </script>
</body>
</html>
