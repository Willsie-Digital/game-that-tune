<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Game That Tune</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      padding-top: 52px;
    }
    #name-bar {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #111111;
      padding: 10px 16px;
      font-size: 0.85rem;
      color: #888;
      text-align: center;
      z-index: 10;
    }
    #name-bar span { color: #eaeaea; font-weight: 700; }

    /* Overlay shown while socket is reconnecting */
    #reconnect-banner {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.93);
      z-index: 50;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #888;
      font-size: 1rem;
    }
    .reconnect-spinner {
      width: 36px; height: 36px;
      border: 3px solid #333;
      border-top-color: #e91e8c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    h1 { font-size: 1.8rem; margin-bottom: 6px; text-align: center; }
    .sub { color: #888; font-size: 0.9rem; margin-bottom: 28px; text-align: center; }

    .screen { width: 100%; max-width: 420px; display: none; flex-direction: column; align-items: center; }
    .screen.active { display: flex; }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #2a2a2a;
      border-radius: 12px;
      background: #1a1a1a;
      color: #f0f0f0;
      font-size: 1.1rem;
      margin-bottom: 12px;
      outline: none;
    }
    input[type="text"]:focus { border-color: #e91e8c; }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: #e91e8c; color: white; }

    .status { text-align: center; padding: 20px 0; }
    .status-icon { font-size: 3rem; margin-bottom: 12px; }
    .status-text { font-size: 1.2rem; margin-bottom: 6px; }
    .status-sub { color: #888; font-size: 0.9rem; }

    .q-counter { color: #888; font-size: 0.85rem; margin-bottom: 10px; align-self: flex-start; }
    .q-text {
      width: 100%;
      font-size: 1.15rem;
      line-height: 1.45;
      text-align: center;
      padding: 16px;
      background: #1a1a1a;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .options { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .opt-btn {
      padding: 16px 10px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: transform 0.1s, opacity 0.2s;
      color: white;
      line-height: 1.3;
      text-align: center;
    }
    .opt-btn:active { transform: scale(0.95); }
    .opt-btn:disabled { cursor: not-allowed; }
    .opt-btn .lbl { font-size: 0.75rem; opacity: 0.8; font-weight: 700; }
    .opt-btn.A { background: #2980b9; }
    .opt-btn.B { background: #c0392b; }
    .opt-btn.C { background: #d35400; }
    .opt-btn.D { background: #27ae60; }
    .opt-btn.selected { box-shadow: 0 0 0 3px white; }
    .opt-btn.correct { box-shadow: 0 0 0 3px #ffffff; }
    .opt-btn.wrong { opacity: 0.3; }

    .result-banner {
      width: 100%;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 16px;
      font-size: 1.3rem;
      font-weight: 700;
    }
    .result-banner.correct { background: #e91e8c; }
    .result-banner.wrong { background: #3d0020; }
    .result-banner.skipped { background: #333; }

    .score-wrap { text-align: center; margin-top: 20px; }
    .score-label { color: #888; font-size: 0.9rem; }
    .score-val { font-size: 2.4rem; font-weight: 700; margin-top: 4px; }

    .lb-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 14px;
      background: #1a1a1a;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 0.95rem;
      width: 100%;
    }
    .lb-row .pts { font-weight: 700; }

    .error { color: #ff6bb5; font-size: 0.85rem; margin-top: 8px; text-align: center; min-height: 1.2em; }
    footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 8px 16px;
      text-align: center;
      font-size: 0.72rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div id="name-bar">Playing as <span id="name-bar-text"></span></div>
  <div id="reconnect-banner">
    <div class="reconnect-spinner"></div>
    <div>Reconnecting…</div>
  </div>

  <div id="join-screen" class="screen active">
    <h1>🎵 Game That Tune</h1>
    <p class="sub">Enter your name to join</p>
    <input type="text" id="name-input" placeholder="Your name" maxlength="20" autocomplete="off" autocorrect="off">
    <button class="btn btn-primary" id="join-btn">Join Game</button>
    <p class="error" id="error-msg"></p>
  </div>

  <div id="lobby-screen" class="screen">
    <div class="status">
      <div class="status-icon">🎸</div>
      <div class="status-text" id="lobby-greeting">You're in!</div>
      <div class="status-sub">Waiting for the host to start…</div>
    </div>
  </div>

  <div id="question-screen" class="screen">
    <div class="q-counter" id="q-counter"></div>
    <div class="q-text" id="q-text"></div>
    <div class="options" id="options"></div>
  </div>

  <div id="waiting-screen" class="screen">
    <div class="status">
      <div class="status-icon">⏳</div>
      <div class="status-text">Answer locked in!</div>
      <div class="status-sub">Waiting for the reveal…</div>
    </div>
  </div>

  <div id="reveal-screen" class="screen">
    <div class="result-banner" id="result-banner"></div>
    <div class="options" id="reveal-options"></div>
    <div class="score-wrap">
      <div class="score-label">Your score</div>
      <div class="score-val" id="score-val">0</div>
    </div>
  </div>

  <div id="gameover-screen" class="screen">
    <div class="status">
      <div class="status-icon">🏆</div>
      <div class="status-text">Game Over!</div>
    </div>
    <div class="score-wrap" style="margin-bottom: 20px;">
      <div class="score-label">Your final score</div>
      <div class="score-val" id="final-score-val">0</div>
    </div>
    <div id="final-lb" style="width:100%"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const LABELS = ['A', 'B', 'C', 'D'];
    const TOKEN_KEY = 'gtt-token';
    const NAME_KEY  = 'gtt-name';

    let currentQuestion = null;
    let hasJoined = false;
    let myScore = 0;

    const reconnectBanner = document.getElementById('reconnect-banner');

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function applySession(name) {
      document.getElementById('name-bar-text').textContent = name;
      document.getElementById('name-bar').style.display = 'block';
      reconnectBanner.style.display = 'none';
      hasJoined = true;
    }

    // Fires on initial connection AND every automatic reconnect
    socket.on('connect', () => {
      const token = localStorage.getItem(TOKEN_KEY);
      if (!hasJoined && token) {
        // Page loaded with a stored token — try to restore silently
        reconnectBanner.style.display = 'flex';
        socket.emit('register', { role: 'player', name: '', sessionToken: token });
      } else if (hasJoined && token) {
        // Mid-game reconnect — re-register to restore server state
        socket.emit('register', { role: 'player', name: '', sessionToken: token });
      }
    });

    socket.on('disconnect', () => {
      if (hasJoined) reconnectBanner.style.display = 'flex';
    });

    // Join form
    document.getElementById('join-btn').addEventListener('click', join);
    document.getElementById('name-input').addEventListener('keypress', e => { if (e.key === 'Enter') join(); });

    function join() {
      const name = document.getElementById('name-input').value.trim();
      if (!name) return;
      document.getElementById('join-btn').disabled = true;
      document.getElementById('error-msg').textContent = '';
      socket.emit('register', { role: 'player', name });
    }

    socket.on('registered', ({ sessionToken, reconnected, name: serverName }) => {
      localStorage.setItem(TOKEN_KEY, sessionToken);
      const displayName = reconnected ? serverName : document.getElementById('name-input').value.trim();
      localStorage.setItem(NAME_KEY, displayName);
      applySession(displayName);
      document.getElementById('lobby-greeting').textContent = reconnected
        ? `Welcome back, ${displayName}! 👋`
        : `Hi, ${displayName}! 👋`;
      // On reconnect the server will push question/reveal if needed; default to lobby
      showScreen('lobby-screen');
    });

    // Server couldn't find the session (e.g. server restarted) — fall back to join form
    socket.on('session-expired', () => {
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(NAME_KEY);
      reconnectBanner.style.display = 'none';
      showScreen('join-screen');
    });

    socket.on('error', (msg) => {
      document.getElementById('error-msg').textContent = msg;
      document.getElementById('join-btn').disabled = false;
    });

    socket.on('game-started', () => {
      showScreen('lobby-screen');
    });

    socket.on('question', (data) => {
      currentQuestion = data;
      document.getElementById('q-counter').textContent = `Question ${data.index + 1} of ${data.total}`;
      document.getElementById('q-text').textContent = data.question;

      const container = document.getElementById('options');
      container.innerHTML = '';
      data.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = `opt-btn ${LABELS[i]}`;
        btn.innerHTML = `<span class="lbl">${LABELS[i]}</span>${opt}`;
        btn.addEventListener('click', () => {
          document.querySelectorAll('#options .opt-btn').forEach(b => b.disabled = true);
          btn.classList.add('selected');
          socket.emit('submit-answer', { answerIndex: i });
          showScreen('waiting-screen');
        });
        container.appendChild(btn);
      });

      showScreen('question-screen');
    });

    socket.on('reveal', (data) => {
      myScore = data.score ?? myScore;
      document.getElementById('score-val').textContent = myScore;

      const banner = document.getElementById('result-banner');
      if (data.yourAnswer === null || data.yourAnswer === undefined) {
        banner.className = 'result-banner skipped';
        banner.textContent = 'No answer submitted';
      } else if (data.correct) {
        banner.className = 'result-banner correct';
        banner.textContent = '✓ Correct!';
      } else {
        banner.className = 'result-banner wrong';
        banner.textContent = '✗ Wrong';
      }

      const container = document.getElementById('reveal-options');
      container.innerHTML = '';
      if (currentQuestion) {
        currentQuestion.options.forEach((opt, i) => {
          const btn = document.createElement('button');
          btn.className = `opt-btn ${LABELS[i]}`;
          btn.innerHTML = `<span class="lbl">${LABELS[i]}</span>${opt}`;
          btn.disabled = true;
          if (i === data.correctIndex) btn.classList.add('correct');
          else if (i === data.yourAnswer) btn.classList.add('wrong');
          container.appendChild(btn);
        });
      }

      showScreen('reveal-screen');
    });

    socket.on('game-over', (data) => {
      document.getElementById('final-score-val').textContent = myScore;
      const container = document.getElementById('final-lb');
      container.innerHTML = data.leaderboard.map((p, i) => `
        <div class="lb-row">
          <span>${['🥇','🥈','🥉'][i] ?? `${i+1}.`} ${p.name}</span>
          <span class="pts">${p.score} pts</span>
        </div>
      `).join('');
      showScreen('gameover-screen');
    });
  </script>
  <footer>
    <!-- ENDLESS ERA GAMING LOGO -->
    <span>Developed by Endless ERA Gaming</span>
  </footer>
</body>
</html>
