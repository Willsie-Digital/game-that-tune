<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game That Tune</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screen { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 1100px; padding: 32px; }
    .screen.active { display: flex; }

    /* ── Lobby ── */
    .lobby-title { font-size: clamp(2.5rem, 6vw, 4.5rem); font-weight: 900; margin-bottom: 8px; }
    .lobby-sub   { color: #888; font-size: clamp(1rem, 2.5vw, 1.4rem); margin-bottom: 36px; }
    .join-card {
      background: #181818;
      border-radius: 16px;
      padding: 24px 48px;
      text-align: center;
      margin-bottom: 28px;
    }
    .join-label { color: #888; font-size: 0.95rem; margin-bottom: 6px; }
    .join-url   { font-size: clamp(1.5rem, 4vw, 2.4rem); font-weight: 800; color: #e91e8c; }
    .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .chip {
      background: #181818;
      border-radius: 20px;
      padding: 8px 18px;
      font-size: clamp(0.85rem, 1.8vw, 1rem);
    }

    /* ── Question ── */
    .q-header { color: #888; font-size: 0.9rem; margin-bottom: 14px; letter-spacing: 0.04em; }
    .q-text {
      font-size: clamp(1.4rem, 3.5vw, 2.2rem);
      font-weight: 700;
      text-align: center;
      line-height: 1.3;
      margin-bottom: 28px;
      max-width: 900px;
    }
    .media-wrap { width: 100%; max-width: 700px; margin-bottom: 24px; text-align: center; }
    .media-wrap video { width: 100%; border-radius: 12px; }
    .now-playing {
      font-size: 3.5rem;
      animation: pulse 1.4s ease-in-out infinite;
      display: inline-block;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1;   transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.82); }
    }

    .opts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: 100%;
      max-width: 860px;
    }
    .opt {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: clamp(14px, 2.5vw, 22px) clamp(16px, 2.5vw, 24px);
      border-radius: 14px;
      font-size: clamp(1rem, 2vw, 1.25rem);
      font-weight: 600;
      line-height: 1.3;
      transition: opacity 0.5s, transform 0.5s, box-shadow 0.5s;
    }
    .opt .lbl { font-size: clamp(1.2rem, 2.5vw, 1.7rem); font-weight: 900; flex-shrink: 0; width: 1.8em; }
    .opt .count { margin-left: auto; background: rgba(0,0,0,0.25); border-radius: 20px; padding: 3px 12px; font-size: clamp(0.85rem, 1.6vw, 1rem); font-weight: 700; flex-shrink: 0; }
    .opt.A { background: #c2185b; }
    .opt.B { background: #7b003d; }
    .opt.C { background: #a30055; }
    .opt.D { background: #f50086; }
    .opt.correct { box-shadow: 0 0 0 4px #ffffff, 0 0 40px #ffffff55; transform: scale(1.03); }
    .opt.wrong   { opacity: 0.2; }

    /* ── Reveal / Game Over ── */
    .lb-wrap { width: 100%; max-width: 620px; margin-top: 28px; }
    .lb-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 14px; text-align: center; color: #888; }
    .lb-row {
      display: flex;
      align-items: center;
      padding: 14px 20px;
      background: #181818;
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      gap: 12px;
    }
    .lb-row:first-child { background: #6a0040; }
    .lb-rank { width: 2.2em; flex-shrink: 0; }
    .lb-name { flex: 1; }
    .lb-pts  { font-weight: 700; color: #e91e8c; }

    .gameover-title { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 900; margin-bottom: 6px; }
    .gameover-sub   { color: #888; font-size: 1.1rem; margin-bottom: 28px; }
  </style>
</head>
<body>

  <div id="lobby-screen" class="screen active">
    <div class="lobby-title">🎵 Game That Tune</div>
    <div class="lobby-sub">A music trivia game</div>
    <div class="join-card">
      <div class="join-label">Join the game on your phone</div>
      <div class="join-url" id="join-url">—</div>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div id="question-screen" class="screen">
    <div class="q-header" id="q-header"></div>
    <div class="q-text" id="q-text"></div>
    <div class="media-wrap" id="media-wrap"></div>
    <div class="opts-grid" id="opts-grid"></div>
  </div>

  <div id="reveal-screen" class="screen">
    <div class="q-text" id="reveal-q-text" style="font-size:clamp(1.1rem,2.5vw,1.7rem);margin-bottom:20px;"></div>
    <div class="opts-grid" id="reveal-opts" style="margin-bottom:0;"></div>
    <div class="lb-wrap">
      <div class="lb-title">Leaderboard</div>
      <div id="lb-list"></div>
    </div>
  </div>

  <div id="gameover-screen" class="screen">
    <div class="gameover-title">🏆 Final Scores</div>
    <div class="gameover-sub">Thanks for playing!</div>
    <div class="lb-wrap">
      <div id="final-lb-list"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const LABELS = ['A', 'B', 'C', 'D'];
    let currentQuestion = null;
    let currentAudio = null;

    function stopAudio() {
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    }

    document.getElementById('join-url').textContent = window.location.host + '/player';

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function renderLeaderboard(list, containerId) {
      const medals = ['🥇', '🥈', '🥉'];
      document.getElementById(containerId).innerHTML = list.slice(0, 5).map((p, i) => `
        <div class="lb-row">
          <span class="lb-rank">${medals[i] ?? `${i + 1}.`}</span>
          <span class="lb-name">${p.name}</span>
          <span class="lb-pts">${p.score} pts</span>
        </div>
      `).join('');
    }

    socket.emit('register', { role: 'display' });

    socket.on('players-update', (players) => {
      document.getElementById('chips').innerHTML = players.map(p => `<div class="chip">🎵 ${p.name}</div>`).join('');
    });

    socket.on('game-started', () => {
      stopAudio();
      currentQuestion = null;
      showScreen('lobby-screen');
    });

    socket.on('question', (data) => {
      currentQuestion = data;
      document.getElementById('q-header').textContent = `QUESTION ${data.index + 1} OF ${data.total}`;
      document.getElementById('q-text').textContent = data.question;

      const mediaWrap = document.getElementById('media-wrap');
      mediaWrap.innerHTML = '';
      stopAudio();
      if (data.audioUrl) {
        currentAudio = new Audio(data.audioUrl);
        currentAudio.play().catch(() => {});
        mediaWrap.innerHTML = '<span class="now-playing">🎵</span>';
      } else if (data.videoUrl) {
        const el = document.createElement('video');
        el.src = data.videoUrl;
        el.controls = true;
        el.autoplay = true;
        mediaWrap.appendChild(el);
      }

      document.getElementById('opts-grid').innerHTML = data.options.map((opt, i) => `
        <div class="opt ${LABELS[i]}"><span class="lbl">${LABELS[i]}</span>${opt}</div>
      `).join('');

      showScreen('question-screen');
    });

    socket.on('audio-control', ({ action }) => {
      if (!currentAudio) return;
      if (action === 'play')   currentAudio.play().catch(() => {});
      if (action === 'pause')  currentAudio.pause();
      if (action === 'replay') { currentAudio.currentTime = 0; currentAudio.play().catch(() => {}); }
    });

    socket.on('reveal', (data) => {
      stopAudio();
      if (currentQuestion) {
        document.getElementById('reveal-q-text').textContent = currentQuestion.question;
        document.getElementById('reveal-opts').innerHTML = currentQuestion.options.map((opt, i) => `
          <div class="opt ${LABELS[i]} ${i === data.correctIndex ? 'correct' : 'wrong'}">
            <span class="lbl">${LABELS[i]}</span>${opt}
            <span class="count">${data.tally ? data.tally[i] : ''}</span>
          </div>
        `).join('');
      }
      renderLeaderboard(data.leaderboard, 'lb-list');
      showScreen('reveal-screen');
    });

    socket.on('game-over', (data) => {
      renderLeaderboard(data.leaderboard, 'final-lb-list');
      showScreen('gameover-screen');
    });
  </script>
</body>
</html>
